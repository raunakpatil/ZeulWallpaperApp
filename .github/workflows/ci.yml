# P2 · Builds and tests on every push and pull request, so a broken build is caught before anyone pulls it.
# Each job only runs when its folder (or this file) changed.
# Optional secret: GOOGLE_SERVICES_JSON (the full contents of android/app/google-services.json),
# needed once the Firebase Gradle plugin is applied (B10). local.properties isn't needed: the build has safe defaults.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      android: ${{ steps.filter.outputs.android }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Which parts changed?
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"; echo "dashboard=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # New branch or force-push: no usable "before" commit, so check everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "android=true" >> "$GITHUB_OUTPUT"; echo "dashboard=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          echo "android=$(echo "$files" | grep -qE '^(android/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dashboard=$(echo "$files" | grep -qE '^(dashboard/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check + build
        run: npm run build

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore google-services.json (if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json restored from secret."
          else
            echo "No GOOGLE_SERVICES_JSON secret; fine until the Firebase plugin is applied (B10)."
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7
