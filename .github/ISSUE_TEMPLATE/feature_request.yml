name: Feature idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need first, then your idea for solving it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to work on this myself
