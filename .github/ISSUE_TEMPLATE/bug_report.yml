name: Bug report
description: Something in Zeul doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
  - type: input
    id: version
    attributes:
      label: Zeul version
      description: The release you installed (Android Settings → Apps → Zeul also shows it)
      placeholder: 1.0.0
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Samsung Galaxy S20+, Android 12
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Drag files here (optional)
